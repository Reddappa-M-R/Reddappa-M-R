<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="contact-form-wrapper" style="width: 100%; max-width: 400px;">
            <h2 style="color: var(--gold); text-align: center; margin-bottom: 20px;">Secure Login</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="cta-button" style="width: 100%;">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
